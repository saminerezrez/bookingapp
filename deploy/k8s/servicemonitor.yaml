# Tells Prometheus to scrape /metrics from every api pod. Needs the monitoring stack installed first (cluster/README.md §4).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
