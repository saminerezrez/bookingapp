# HTTP to HTTPS for grafana.<domain>. Traefik only reads Middlewares from the Ingress's own namespace,
# so this is a copy of the one in deploy/k8s/ingress.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true
