# The nginx image fills in ${DOMAIN} at startup and leaves nginx's own variables alone.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Static files only. The page loads them from the root domain, so the browser needs the CORS header.
server {
    listen 80;
    server_name cdn.${DOMAIN};
    root /usr/share/nginx/html;

    location = /index.html {
        return 404;
    }

    location / {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "https://${DOMAIN}";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "https://${DOMAIN}";
    }
}
